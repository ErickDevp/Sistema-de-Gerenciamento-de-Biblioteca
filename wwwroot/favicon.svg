<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fundo -->
  <rect width="32" height="32" rx="6" fill="#1a3a5c"/>
  <!-- Livro aberto -->
  <rect x="5" y="8" width="10" height="16" rx="1.5" fill="#fff" opacity="0.9"/>
  <rect x="17" y="8" width="10" height="16" rx="1.5" fill="#fff" opacity="0.9"/>
  <rect x="15" y="7" width="2" height="18" rx="1" fill="#f0a500"/>
  <!-- Linhas no livro esquerdo -->
  <rect x="7" y="12" width="6" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
  <rect x="7" y="14.5" width="6" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
  <rect x="7" y="17" width="4" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
  <!-- Linhas no livro direito -->
  <rect x="19" y="12" width="6" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
  <rect x="19" y="14.5" width="6" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
  <rect x="19" y="17" width="4" height="1.2" rx="0.6" fill="#1a3a5c" opacity="0.4"/>
</svg>
